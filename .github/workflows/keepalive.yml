name: Keep Supabase Alive

# Supabase free-tier projects auto-pause after ~7 days with no activity.
# This pings the REST API daily so the project stays Active.
# Uses the same secrets as the deploy workflow.

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/tasks?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          # 2xx/4xx both prove the project is awake; only a connection failure is bad.
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::error::Supabase did not respond — project may be paused."
            exit 1
          fi
